name: QA Practice

on: push

jobs:
  qa-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check calculator result
        run: |
          python -c "assert 2 + 3 == 5, 'Expected 5, but calculation failed'"

      - name: Check subtraction
        run: |
          python -c "assert 10 - 4 == 6, 'Expected 6, but subtraction failed'"
          echo "TEST PASSED: 10 - 4 = 6"

      - name: Check multiplication
        run: |
          python -c "assert 5 * 5 == 25, 'Expected 25, but multiplication failed'"
          
      - name: Create test report
        run: |
          echo "QA TEST REPORT" > test-report.txt
          echo "Calculator: PASS" >> test-report.txt
          echo "Subtraction: PASS" >> test-report.txt
          echo "Multiplication: PASS" >> test-report.txt

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: qa-test-report
          path: test-report.txt
